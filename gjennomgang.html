<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slottet steg for steg</title>
<style>
:root{
  --natt:#1E1B33;
  --dyp:#161430;
  --dypere:#0F0E1E;
  --panel:#272348;
  --panel2:#2F2A56;
  --strek:#453D74;
  --tekst:#EDE6D8;
  --dempet:#A8A0C8;
  --svak:#7C769C;
  --messing:#E8B04B;
  --mose:#86C99A;
  --rust:#E0745A;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--natt);color:var(--tekst);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--messing);outline-offset:2px}

#scene{position:fixed;inset:0;background:var(--natt)}
#stage{
  position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;
  display:grid;grid-template-rows:56px 1fr 180px;gap:16px;padding:22px 24px 24px;
}

/* ---------- Toppen ---------- */
.topp{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--strek);padding-bottom:10px;min-width:0}
.merkenavn{font-size:19px;white-space:nowrap;margin:0;font-weight:400}
.merkenavn span{color:var(--dempet)}
#kapitler{flex:1;display:flex;gap:8px;min-width:0}
.kap{flex:1 1 0;min-width:0;background:none;border:0;padding:6px 2px 4px;color:var(--svak);font-size:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.kap .navn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kap .spor{height:3px;background:var(--strek);border-radius:2px;overflow:hidden}
.kap .spor i{display:block;height:100%;width:0;background:var(--messing);transition:width .35s}
.kap.ferdig{color:var(--dempet)}
.kap.ferdig .spor i{width:100%;background:var(--svak)}
.kap.naa{color:var(--tekst)}
.kap:hover{color:var(--tekst)}
.teller{font-family:var(--mono);font-size:14px;color:var(--dempet);white-space:nowrap;font-variant-numeric:tabular-nums}
.liten{background:none;border:1px solid var(--strek);color:var(--dempet);font:13px var(--mono);padding:6px 10px;border-radius:3px;cursor:pointer;white-space:nowrap}
a.liten{text-decoration:none}
.liten:hover{color:var(--tekst);border-color:var(--svak)}

/* ---------- Flaten ---------- */
.flate{display:grid;grid-template-columns:850px 1fr;grid-template-rows:252px 116px 1fr;gap:12px 16px;min-height:0}
.panel{background:var(--dyp);border:1px solid var(--strek);border-radius:4px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.kode{grid-row:1 / 4}
.phode{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 14px;border-bottom:1px solid var(--strek);font:12.5px var(--mono);color:var(--dempet);letter-spacing:.02em;white-space:nowrap}
.phode b{color:var(--tekst);font-weight:400}
.phode .info{color:var(--messing);font-variant-numeric:tabular-nums}

.vindu{position:relative;flex:1;overflow:hidden}
.rader{position:absolute;left:0;right:0;top:0;padding-block:10px;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.rad{position:relative;display:flex;height:22px;line-height:22px;font:14.5px/22px var(--mono);white-space:pre;transition:opacity .3s}
.nr{flex:0 0 62px;text-align:right;padding-right:20px;color:var(--svak);font-variant-numeric:tabular-nums}
.src{color:#CFC8DE}
.fokus .rad{opacity:.4}
.fokus .rad.lys{opacity:1}
.rad.lys .nr{color:var(--messing)}
.band{position:absolute;left:0;right:0;height:22px;background:rgba(232,176,75,.13);pointer-events:none;transition:top .45s cubic-bezier(.3,.7,.2,1),height .45s cubic-bezier(.3,.7,.2,1)}
.band::before{content:"\25B6";position:absolute;left:9px;top:0;font-size:10px;line-height:22px;color:var(--messing)}
.band.hva{background:rgba(224,116,90,.12);outline:1px dashed rgba(224,116,90,.75);outline-offset:-1px}
.band.hva::before{content:"?";font:700 13px/22px var(--mono);color:var(--rust)}
.kw{color:#B9A8F5}.st{color:#A9D8B5}.tl{color:#F0B27A}.km{color:#726C98;font-style:italic}.fn{color:#F4ECDD}.bi{color:#8FC6E8}.dc{color:#726C98}

/* kart */
.kart svg{display:block;width:100%;flex:1;min-height:0}
.node rect{fill:var(--panel);stroke:var(--strek);stroke-width:1.3;transition:fill .45s,stroke .45s}
.node text{font:16px var(--serif);fill:var(--dempet);text-anchor:middle;transition:fill .45s}
.node.her rect{fill:#3B3222;stroke:var(--messing)}
.node.her text{fill:var(--tekst)}
.node.seier rect{fill:#24412F;stroke:var(--mose)}
.node.seier text{fill:var(--tekst)}
.kant{fill:none;stroke:var(--strek);stroke-width:2;transition:stroke .45s}
.kant.aktiv{stroke:var(--messing)}
.klabel{font:10.5px var(--mono);fill:var(--svak);letter-spacing:.04em}
#brikke{transition:transform .65s cubic-bezier(.3,.7,.2,1),opacity .3s}
#brikke .kjerne{fill:var(--messing)}
#brikke .glod{fill:var(--messing);opacity:.22}

/* minne */
.vars{display:grid;grid-template-columns:1.05fr 1.2fr 1.9fr 1.2fr .8fr;gap:12px;padding:9px 14px 2px}
.var{min-width:0}
.var .n{font:12px var(--mono);color:var(--dempet)}
.var .v{display:inline-block;max-width:100%;font:17px/24px var(--mono);color:var(--tekst);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:0 4px;margin-left:-4px;vertical-align:top}
.var .v.tom{color:var(--svak)}
.bar{display:flex;gap:2px;height:5px;margin-top:3px}
.bar i{flex:1;background:var(--strek);border-radius:1px}
.bar.liv i.p{background:var(--mose)}
.bar.troll i.p{background:var(--rust)}
.var.endret .v{animation:blink 1.4s ease-out}
@keyframes blink{0%{background:var(--messing);color:var(--natt)}35%{background:rgba(232,176,75,.55);color:var(--natt)}100%{background:transparent}}
.tmp{padding:4px 14px 8px;font:12.5px var(--mono);color:var(--svak);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmp b{color:var(--dempet);font-weight:400}

/* terminal */
.term{flex:1;overflow-y:auto;scrollbar-width:none;padding:10px 14px;font:14px/1.5 var(--mono);color:#D9D3E8;background:var(--dypere)}
.term::-webkit-scrollbar{display:none}
.linje{white-space:pre-wrap;min-height:21px}
.linje.ny{animation:inn .28s ease-out both}
.prompt{color:var(--dempet)}
.svar{color:var(--messing)}
.markor{display:inline-block;width:8px;height:16px;background:var(--messing);vertical-align:-3px;margin-left:1px;animation:blunk 1s steps(1) infinite}
@keyframes blunk{50%{opacity:0}}
@keyframes inn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Fortellingen ---------- */
.fortelling{display:grid;grid-template-columns:1fr 390px 150px;gap:26px;border-top:1px solid var(--strek);padding-top:16px;min-height:0}
.kapnavn{font:13px var(--mono);color:var(--messing);letter-spacing:.09em;text-transform:uppercase;margin:0 0 8px;display:flex;gap:12px;align-items:center}
.chip{font:11.5px var(--mono);letter-spacing:.06em;color:var(--natt);background:var(--rust);padding:1px 8px;border-radius:3px;text-transform:none}
#fortell{font-size:26px;line-height:1.42;margin:0;text-wrap:pretty}
#fortell code,.sp code,.kort code{font-family:var(--mono);font-size:.82em;color:var(--messing);background:var(--panel);padding:0 5px;border-radius:3px}
.sporsmal{background:var(--panel);border:1px solid var(--strek);border-radius:4px;padding:12px 16px;align-self:start;transition:opacity .3s}
.sporsmal.skjult{opacity:0}
.sporsmal .lbl{font:11.5px var(--mono);letter-spacing:.1em;color:var(--dempet);margin:0 0 5px}
.sp{font-size:19.5px;font-style:italic;line-height:1.4;margin:0}
.knapper{display:flex;flex-direction:column;gap:8px;align-self:end}
.knapper button{font-size:16px;padding:10px 14px;border-radius:3px;cursor:pointer;border:1px solid var(--strek);background:var(--panel);color:var(--tekst)}
.knapper #neste{background:var(--messing);color:var(--natt);border-color:var(--messing)}
.knapper button:disabled{opacity:.35;cursor:default}

/* ---------- Kort ---------- */
.kort{position:absolute;left:24px;right:24px;top:100px;bottom:24px;background:var(--natt);display:flex;flex-direction:column;justify-content:center;padding:30px 80px 40px;animation:inn .4s ease-out}
.kort .eyebrow{font:14px var(--mono);letter-spacing:.12em;color:var(--messing);margin:0}
.kort h1{font-size:80px;font-weight:400;line-height:1.04;letter-spacing:-.015em;margin:16px 0 26px;max-width:15ch;text-wrap:balance}
.kort .ingress{font-size:27px;line-height:1.45;color:var(--dempet);max-width:54ch;margin:0}
.taster{display:flex;flex-wrap:wrap;gap:14px 40px;margin-top:52px;font-size:18px;color:var(--dempet)}
kbd{font:14px var(--mono);color:var(--tekst);border:1px solid var(--strek);border-bottom-width:2px;border-radius:3px;padding:2px 8px;margin-right:6px;background:var(--panel)}
.tre{display:grid;grid-template-columns:repeat(3,1fr);gap:44px;margin-top:34px}
.tre h2{font-size:29px;font-weight:400;line-height:1.2;margin:0 0 12px;text-wrap:balance}
.tre p{font-size:20px;line-height:1.5;color:var(--dempet);margin:0}
.oppgave{margin-top:46px;font-size:23px;border-top:1px solid var(--strek);padding-top:22px}
.oppgave b{color:var(--messing);font:15px var(--mono);letter-spacing:.1em;margin-right:14px}

/* ---------- Smal skjerm ---------- */
html.smal body{overflow:auto}
html.smal #scene{position:static}
html.smal #stage{position:static;width:auto;height:auto;transform:none;display:flex;flex-direction:column;gap:14px;padding:14px 16px 32px}
html.smal .topp{flex-wrap:wrap;gap:10px 16px}
html.smal #kapitler{display:none}
html.smal .flate{order:2;display:flex;flex-direction:column;gap:12px}
html.smal .fortelling{order:1;grid-template-columns:1fr;gap:12px}
html.smal .vindu{height:320px;flex:none}
html.smal .rad{font-size:12.5px}
html.smal .nr{flex-basis:44px;padding-right:12px}
html.smal .vars{grid-template-columns:repeat(3,minmax(0,1fr))}
html.smal .term{height:220px;flex:none}
html.smal #fortell{font-size:19px}
html.smal .sp{font-size:16px}
html.smal .knapper{flex-direction:row}
html.smal .knapper button{flex:1}
html.smal .kort{position:static;padding:24px 0}
html.smal .kort h1{font-size:40px}
html.smal .kort .ingress{font-size:19px}
html.smal .tre{grid-template-columns:1fr;gap:22px}
html.smal .tre h2{font-size:22px}
html.smal .tre p,html.smal .oppgave{font-size:17px}
html.smal .taster{font-size:15px;margin-top:28px}
html.smal .viser-kort .flate{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="scene">
  <div id="stage">
    <header class="topp">
      <p class="merkenavn">Det glemte slottet</p>
      <nav id="kapitler" aria-label="Kapitler"></nav>
      <span class="teller"><span id="nr">1</span> / <span id="tot">1</span></span>
      <button class="liten" id="fullskjerm" type="button">Fullskjerm</button>
      <a class="liten" href="index.html">← Til nettsiden</a>
    </header>

    <main class="flate" id="flate">
      <section class="panel kode" aria-label="Koden">
        <div class="phode"><b>fasit_slottet.py</b><span class="info" id="linjeinfo"></span></div>
        <div class="vindu"><div class="rader" id="rader"></div></div>
      </section>

      <section class="panel kart" aria-label="Hvor spilleren er">
        <div class="phode"><span>Hvor er spilleren?</span><span class="info" id="runde"></span></div>
        <svg viewBox="0 0 700 204" role="img" aria-label="Kart over stedene: ute, skogen, hallen, trappen og rommet">
          <path class="kant" id="k-skogen-ute" d="M288,34 L120,34 L120,84"/>
          <path class="kant" id="k-hallen-ute" d="M350,52 L350,84"/>
          <path class="kant" id="k-hallen-trappen" d="M412,102 L518,102"/>
          <path class="kant" id="k-hallen-rommet" d="M350,120 L350,152"/>
          <text class="klabel" x="204" y="27" text-anchor="middle">SKOGEN / TILBAKE</text>
          <text class="klabel" x="360" y="73">SLOTTET / UT</text>
          <text class="klabel" x="465" y="94" text-anchor="middle">TRAPPEN</text>
          <text class="klabel" x="360" y="141">DØREN / TILBAKE</text>
          <g class="node" id="n-ute"><rect x="288" y="16" width="124" height="36" rx="5"/><text x="350" y="39.5">ute</text></g>
          <g class="node" id="n-skogen"><rect x="58" y="84" width="124" height="36" rx="5"/><text x="120" y="107.5">skogen</text></g>
          <g class="node" id="n-hallen"><rect x="288" y="84" width="124" height="36" rx="5"/><text x="350" y="107.5">hallen</text></g>
          <g class="node" id="n-trappen"><rect x="518" y="84" width="124" height="36" rx="5"/><text x="580" y="107.5">trappen</text></g>
          <g class="node" id="n-rommet"><rect x="288" y="152" width="124" height="36" rx="5"/><text x="350" y="175.5">rommet</text></g>
          <g id="brikke" style="opacity:0"><circle class="glod" r="11"/><circle class="kjerne" r="5.5"/></g>
        </svg>
      </section>

      <section class="panel minne" aria-label="Det programmet husker">
        <div class="phode"><span>Det programmet husker</span><span>variabler</span></div>
        <div class="vars" id="vars"></div>
        <div class="tmp" id="tmp"></div>
      </section>

      <section class="panel terminal" aria-label="Det spilleren ser">
        <div class="phode"><span>Det spilleren ser</span><span>terminal</span></div>
        <div class="term" id="term" aria-live="polite"></div>
      </section>
    </main>

    <footer class="fortelling">
      <div>
        <p class="kapnavn" id="kapnavn"></p>
        <p id="fortell"></p>
      </div>
      <aside class="sporsmal" id="sporsmal"><p class="lbl">SPØR KLASSEN</p><p class="sp" id="sp"></p></aside>
      <div class="knapper">
        <button type="button" id="neste">Neste →</button>
        <button type="button" id="forrige">← Tilbake</button>
      </div>
    </footer>

    <div class="kort" id="kort" hidden></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Kopi av fasit_slottet.py. Endres fasiten, må koden her og linjenumrene i STEG oppdateres.
  var KODE = "\"\"\"\nFASIT - Det glemte slottet\n\nEn mulig løsning på de sju kodeoppgavene i steg 2. Ikke den eneste riktige.\nEkstrautfordring A (DRIKK når som helst) er med, inne i spor(). De andre\nekstrautfordringene (poeng, nye steder, flere avslutninger) er ikke tatt med.\n\nTil lærer: elevfilen heter slottet.py og ligger i samme mappe.\n\"\"\"\n\nimport random\n\n# ---------- VARIABLER ----------\n\nliv = 10\ninventar = []\nspiller = True\nsted = \"ute\"        # hvor spilleren er akkurat nå\n\n# ---------- DICTIONARY ----------\n# Alt vi trenger å vite om en fiende ligger samlet på ett sted.\n\nfiender = {\n    \"troll\": {\"liv\": 8, \"min_skade\": 2, \"maks_skade\": 4},\n    \"rotte\": {\"liv\": 2, \"min_skade\": 1, \"maks_skade\": 2},        # OPPGAVE 6\n}\n\n# Trollets liv lages her oppe, utenfor løkken.\n# Da husker spillet det, og et beseiret troll forblir dødt.\ntroll_liv = fiender[\"troll\"][\"liv\"]\n\n# ---------- FUNKSJONER ----------\n\ndef vis_status():\n    # OPPGAVE 1\n    print(\"Liv:\", liv)\n\n    if len(inventar) == 0:\n        print(\"Sekken er tom.\")\n    else:\n        print(\"I sekken:\")\n        for ting in inventar:\n            print(\" -\", ting)\n\n\ndef terning(minste, storste):\n    \"\"\"Gir et tilfeldig heltall fra minste til og med storste.\"\"\"\n    return random.randint(minste, storste)\n\n\ndef spor(sporsmal):\n    \"\"\"Stiller et spørsmål og gjør svaret om til små bokstaver.\"\"\"\n    global liv          # EKSTRA A: funksjonen må få lov til å endre liv, ikke bare lese den\n\n    svar = input(sporsmal).lower().strip()\n\n    # Så lenge spilleren skriver DRIKK, drikker vi og stiller spørsmålet på nytt.\n    # Alle spørsmål i spillet går gjennom spor(), så DRIKK virker overalt.\n    while svar == \"drikk\":\n        if \"helsedrikk\" in inventar:\n            inventar.remove(\"helsedrikk\")\n            liv = liv + 5\n            print(\"Du drikker helsedrikken. Liv:\", liv)\n        else:\n            print(\"Du har ingen helsedrikk i sekken.\")\n        svar = input(sporsmal).lower().strip()\n\n    return svar\n\n\n# ---------- SPILLET ----------\n\nprint(\"DET GLEMTE SLOTTET\")\nprint()\nprint(\"Du våkner utenfor et forlatt slott.\")\nprint(\"Porten står på gløtt.\")\n\nwhile spiller:\n\n    print()\n    vis_status()\n    print()\n\n    # Hver runde sjekker vi hvor spilleren står, og viser bare det stedet.\n    # Spilleren flytter seg ved at vi gir sted en ny verdi.\n\n    if sted == \"ute\":\n\n        valg = spor(\"Går du inn i SLOTTET eller inn i SKOGEN? \")\n\n        if valg == \"slottet\":\n            sted = \"hallen\"\n        elif valg == \"skogen\":\n            sted = \"skogen\"\n        else:\n            print(\"Du må velge SLOTTET eller SKOGEN.\")\n\n    elif sted == \"hallen\":\n\n        print(\"Inngangshallen er kald og mørk.\")\n        print(\"Du ser en gammel tredør, og en trapp som går opp i mørket.\")\n\n        valg = spor(\"Velger du DØREN, TRAPPEN, eller går du UT? \")\n\n        if valg == \"døren\":\n            sted = \"rommet\"\n        elif valg == \"trappen\":\n            sted = \"trappen\"\n        elif valg == \"ut\":\n            sted = \"ute\"\n        else:\n            print(\"Du blir stående. Ingenting skjer.\")\n\n    elif sted == \"rommet\":\n\n        print(\"Du står i et lite rom. En stor kiste med jernbeslag står mot veggen.\")\n\n        valg = spor(\"Vil du ÅPNE kisten, eller gå TILBAKE til hallen? \")\n\n        if valg == \"åpne\":\n            # OPPGAVE 2\n            if \"gullnøkkel\" in inventar:\n                print(\"Kisten er allerede tom. Du har tatt det som lå her.\")\n            else:\n                inventar.append(\"gullnøkkel\")\n                print(\"Lokket knirker opp.\")\n                print(\"Inni ligger en liten GULLNØKKEL. Du legger den i sekken.\")\n        elif valg == \"tilbake\":\n            sted = \"hallen\"\n        else:\n            print(\"Du blir stående. Ingenting skjer.\")\n\n    elif sted == \"trappen\":\n\n        if troll_liv > 0:\n\n            print(\"Halvveis opp reiser et stort troll seg foran deg.\")\n            print(\"INGEN PASSERER, brøler det.\")\n\n            troll = fiender[\"troll\"]\n\n            # OPPGAVE 3\n            while troll_liv > 0 and liv > 0:\n\n                svar = spor(\"ANGRIP eller FLYKT? \")\n\n                if svar == \"angrip\":\n\n                    skade = terning(1, 4)\n                    troll_liv = troll_liv - skade\n                    print(\"Du treffer trollet for\", skade, \"skade.\")\n\n                    if troll_liv > 0:\n                        tilbake = terning(troll[\"min_skade\"], troll[\"maks_skade\"])\n                        liv = liv - tilbake\n                        print(\"Trollet slår tilbake, og du mister\", tilbake, \"liv.\")\n                        print(\"Liv igjen:\", liv)\n\n                elif svar == \"flykt\":\n                    print(\"Du kaster deg ned trappen igjen.\")\n                    break\n\n                else:\n                    print(\"Trollet venter. Du må velge.\")\n\n        else:\n            print(\"Trollet ligger fortsatt på trappen der du slo det ned.\")\n\n        if troll_liv <= 0:\n\n            print()\n            print(\"Trollet er beseiret. Bak det står en tung, låst dør.\")\n\n            # OPPGAVE 4\n            if \"gullnøkkel\" in inventar:\n                print(\"Nøkkelen passer. Låsen klikker.\")\n                print(\"Bak døren ligger slottets gamle skattkammer.\")\n                print(\"Du har funnet skatten. DU VANT!\")\n                spiller = False\n            else:\n                print(\"Døren er låst. Et sted i slottet finnes en nøkkel.\")\n\n        # Vant du ikke, går du ned til hallen igjen.\n        sted = \"hallen\"\n\n    elif sted == \"skogen\":\n\n        print(\"Trærne står tett. Noe rasler i buskene.\")\n\n        valg = spor(\"Vil du LETE i buskene, eller gå TILBAKE til slottet? \")\n\n        if valg == \"le       var inner;
      if (idoc) { inner = '<span class="dc">' + esc(l) + "</span>"; if (l.indexOf('"""') !== -1) idoc = false; }
      else if (l.trim() === '"""') { inner = '<span class="dc">' + esc(l) + "</span>"; idoc = true; }
      else inner = farg(l);
      html += '<div class="rad"><span class="nr">' + (i + 1) + '</span><span class="src">' + (inner || " ") + "</span></div>";
    });
    rader.innerHTML = html;
    RADER = rader.querySelectorAll(".rad");
  })();

  /* ---------- Kapittelknapper ---------- */
  var kapEl = $("kapitler");
  KAPITLER.forEach(function (navn, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "kap"; b.id = "kap-" + i;
    b.innerHTML = '<span class="navn">' + (i + 1) + ". " + navn + '</span><span class="spor"><i></i></span>';
    b.addEventListener("click", function () { gaa(KAPSTART[i]); });
    kapEl.appendChild(b);
  });
  $("tot").textContent = STEG.length;

  /* ---------- Kart ---------- */
  var POS = { ute: [350, 34], skogen: [120, 102], hallen: [350, 102], trappen: [580, 102], rommet: [350, 170] };
  var brikke = $("brikke");

  /* ---------- Terminal ---------- */
  var termEl = $("term"), timere = [];
  function stoppAnimasjon() { timere.forEach(clearTimeout); timere = []; }
  function lagLinje(item, ny) {
    var d = document.createElement("div");
    d.className = "linje" + (ny ? " ny" : "");
    if (typeof item === "string") d.textContent = item;
    else d.innerHTML = '<span class="prompt">' + esc(item.p) + '</span><span class="svar">' + (ny ? "" : esc(item.a)) + "</span>";
    return d;
  }
  function bunn() { termEl.scrollTop = termEl.scrollHeight; }
  function tegnTerminal(s, antallNye, animer) {
    stoppAnimasjon();
    termEl.innerHTML = "";
    var faste = s.term.length - antallNye;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < (animer ? faste : s.term.length); i++) frag.appendChild(lagLinje(s.term[i], false));
    termEl.appendChild(frag);
    bunn();
    if (!animer) return;
    var t = 120;
    s.term.slice(faste).forEach(function (item) {
      if (typeof item === "string") {
        timere.push(setTimeout(function () { termEl.appendChild(lagLinje(item, true)); bunn(); }, t));
        t += 85;
      } else {
        var d;
        timere.push(setTimeout(function () {
          d = lagLinje(item, true);
          var m = document.createElement("span"); m.className = "markor";
          d.appendChild(m);
          termEl.appendChild(d); bunn();
        }, t));
        t += 420;
        item.a.split("").forEach(function (_, ci) {
          timere.push(setTimeout(function () { d.querySelector(".svar").textContent = item.a.slice(0, ci + 1); }, t));
          t += 70;
        });
        timere.push(setTimeout(function () { var m = d.querySelector(".markor"); if (m) m.remove(); }, t + 180));
        t += 260;
      }
    });
  }

  /* ---------- Variabler ---------- */
  function verdi(v) {
    if (v === undefined) return { txt: "ikke laget", tom: true };
    if (v === true) return { txt: "True" };
    if (v === false) return { txt: "False" };
    if (Array.isArray(v)) return { txt: "[" + v.map(function (x) { return '"' + x + '"'; }).join(", ") + "]" };
    if (typeof v === "string") return { txt: '"' + v + '"' };
    return { txt: String(v).replace("-", "−") };
  }
  function bar(v, maks, kl) {
    if (typeof v !== "number") return "";
    var h = '<div class="bar ' + kl + '">';
    for (var i = 0; i < maks; i++) h += "<i" + (i < v ? ' class="p"' : "") + "></i>";
    return h + "</div>";
  }
  function tegnVars(s, p, blink) {
    var navn = ["sted", "liv", "inventar", "troll_liv", "spiller"], h = "";
    navn.forEach(function (n) {
      var v = verdi(s[n]);
      var endret = blink && p && JSON.stringify(p[n]) !== JSON.stringify(s[n]);
      h += '<div class="var' + (endret ? " endret" : "") + '"><div class="n">' + n + '</div><span class="v' + (v.tom ? " tom" : "") + '">' + esc(v.txt) + "</span>" +
        (n === "liv" ? bar(s.liv, 10, "liv") : n === "troll_liv" ? bar(s.troll_liv, 8, "troll") : "") + "</div>";
    });
    $("vars").innerHTML = h;
    var keys = Object.keys(s.tmp);
    $("tmp").innerHTML = keys.length
      ? "<b>i denne runden:</b> " + keys.map(function (key) { return esc(key + " = " + verdi(s.tmp[key]).txt); }).join("   ")
      : "<b>i denne runden:</b> ingen";
  }

  /* ---------- Tegn et steg ---------- */
  var naa = 0;
  function tegn(n, fraForrige) {
    var st = STEG[n], s = TILSTAND[n], p = n > 0 ? TILSTAND[n - 1] : null;
    var animer = fraForrige && !redusert;

    $("stage").classList.toggle("viser-kort", !!st.kort);
    var kort = $("kort");
    if (st.kort) { kort.innerHTML = KORT[st.kort]; kort.hidden = false; } else { kort.hidden = true; }

    // topp
    KAPITLER.forEach(function (_, i) {
      var b = $("kap-" + i), start = KAPSTART[i], slutt = i + 1 < KAPITLER.length ? KAPSTART[i + 1] : STEG.length;
      b.classList.toggle("naa", st.k === i);
      b.classList.toggle("ferdig", st.k > i);
      b.querySelector("i").style.width = st.k === i ? ((n - start + 1) / (slutt - start) * 100) + "%" : "";
      if (st.k === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("nr").textContent = n + 1;

    // kode
    var vindu = rader.parentNode;
    rader.querySelectorAll(".band").forEach(function (b) { b.remove(); });
    RADER.forEach(function (r) { r.classList.remove("lys"); });
    if (st.l) {
      var a = st.l[0], b2 = st.l[1];
      for (var i = a; i <= b2; i++) RADER[i - 1].classList.add("lys");
      var band = document.createElement("div");
      band.className = "band" + (st.hva ? " hva" : "");
      band.style.top = (PAD + (a - 1) * LH) + "px";
      band.style.height = ((b2 - a + 1) * LH) + "px";
      rader.appendChild(band);
      rader.classList.add("fokus");
      var hoyde = vindu.clientHeight || 560;
      var maks = PAD * 2 + RADER.length * LH - hoyde;
      var mal = PAD + (a - 1) * LH + ((b2 - a + 1) * LH) / 2 - hoyde / 2;
      if ((b2 - a + 1) * LH > hoyde - 40) mal = PAD + (a - 1) * LH - 30;
      mal = Math.max(0, Math.min(maks, mal));
      rader.style.transform = "translateY(" + (-mal) + "px)";
      $("linjeinfo").textContent = a === b2 ? "linje " + a : "linje " + a + "–" + b2;
    } else {
      rader.classList.remove("fokus");
      $("linjeinfo").textContent = "";
    }

    // kart
    Object.keys(POS).forEach(function (key) {
      var g = $("n-" + key);
      g.classList.toggle("her", !s.vunnet && s.sted === key);
      g.classList.toggle("seier", s.vunnet && key === "trappen");
    });
    document.querySelectorAll(".kant").forEach(function (e) { e.classList.remove("aktiv"); });
    if (fraForrige && p && p.sted && s.sted && p.sted !== s.sted && !s.vunnet) {
      var kant = $("k-" + [p.sted, s.sted].sort().join("-"));
      if (kant) kant.classList.add("aktiv");
    }
    var plass = s.vunnet ? "trappen" : s.sted;
    if (plass) {
      brikke.style.opacity = s.vunnet ? "0" : "1";
      brikke.style.transform = "translate(" + (POS[plass][0] - 46) + "px," + POS[plass][1] + "px)";
    } else {
      brikke.style.opacity = "0";
    }
    $("runde").textContent = s.slutt ? "spillet er slutt" : s.vunnet ? "runde " + s.runde + " · DU VANT" : s.runde ? "runde " + s.runde : "før spillet starter";

    tegnVars(s, p, fraForrige);
    tegnTerminal(s, (st.term || []).length, animer);

    // fortelling
    $("kapnavn").innerHTML = (st.k === 0 ? "Intro" : "Kapittel " + st.k + " · " + KAPITLER[st.k]) + (st.hva ? '<span class="chip">Hva om?</span>' : "");
    $("fortell").innerHTML = st.t || "";
    $("sp").innerHTML = st.q || "";
    $("sporsmal").classList.toggle("skjult", !st.q);

    $("forrige").disabled = n === 0;
    $("neste").disabled = n === STEG.length - 1;
    $("neste").textContent = n === 0 ? "Start →" : "Neste →";
    try { localStorage.setItem("slottet-flyt-steg", String(n)); } catch (e) {}
  }

  function gaa(n) {
    n = Math.max(0, Math.min(STEG.length - 1, n));
    var fraForrige = n === naa + 1;
    naa = n;
    tegn(n, fraForrige);
  }

  /* ---------- Styring ---------- */
  $("neste").addEventListener("click", function () { gaa(naa + 1); });
  $("forrige").addEventListener("click", function () { gaa(naa - 1); });
  function fullskjerm() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) {}
  }
  $("fullskjerm").addEventListener("click", fullskjerm);

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var paKnapp = e.target && e.target.tagName === "BUTTON";
    var k = e.key;
    if ((k === "Enter" || k === " ") && paKnapp) return;
    if (k === "ArrowRight" || k === " " || k === "PageDown" || k === "Enter") { e.preventDefault(); gaa(naa + 1); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); gaa(naa - 1); }
    else if (k === "Home") { e.preventDefault(); gaa(0); }
    else if (k === "End") { e.preventDefault(); gaa(STEG.length - 1); }
    else if (k === "f" || k === "F") { fullskjerm(); }
    else if (/^[1-9]$/.test(k)) { gaa(KAPSTART[+k - 1]); }
  });

  /* ---------- Skalering ---------- */
  function skaler() {
    var smal = window.innerWidth < 760;
    document.documentElement.classList.toggle("smal", smal);
    var stage = $("stage");
    if (smal) { stage.style.transform = ""; return; }
    var sk = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    var x = (window.innerWidth - 1600 * sk) / 2, y = (window.innerHeight - 900 * sk) / 2;
    stage.style.transform = "translate(" + x + "px," + y + "px) scale(" + sk + ")";
  }
  window.addEventListener("resize", function () { skaler(); tegn(naa, false); });

  /* ---------- Start ---------- */
  function start() {
    skaler();
    var fraHash = /steg=(\d+)/.exec(location.hash || "");
    var lagret = null;
    try { lagret = localStorage.getItem("slottet-flyt-steg"); } catch (e) {}
    var n = fraHash ? +fraHash[1] - 1 : lagret !== null ? +lagret : 0;
    naa = Math.max(0, Math.min(STEG.length - 1, isNaN(n) ? 0 : n));
    tegn(naa, false);
  }
  start();
})();
</script>
</body>
</html>
